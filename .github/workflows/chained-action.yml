# Example of a chained workflow. (Only complete the following if the prior succeeded)
name: Chained Workflow

run-name: Following up on ${{ workflow.name }}

on:
  workflow_run:
    workflows: ['Github Actions Demo']
    types:
      - completed

jobs:
  do_thing:
    name: Do the thing
    runs-on: ubuntu-latest
    steps:
      - name: Party time!
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "Yay! Party!"
      - name: Sad time!
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Be sad now."
