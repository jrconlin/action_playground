# Package up things and ship them to pypi
name: Package and Publish

run-name: Package and Publish

on:
  workflow_run:
    # Only fire on main if the `Python Checks` workflow is
    # complete. We could also add a complex `if:`, but this
    # is more straight-forward
    workflows:
      - 'Python Checks'
    types:
      - completed
    branches:
      - main

jobs:
  # Build the release
  release-build:
    runs-on: ubuntu-latest
    # Only do this job if the dependent workflow succeeded and the pull name doesn't
    # start with "doc/"
    # See conditional info <https://docs.github.com/en/actions/reference/workflows-and-actions/expressions>
    if: ${{ github.event.workflow_run.conclusion == 'success'}} && !startsWith({{ github.event.ref_name }}, "doc/")
    environment:
      name: pypi-publish
      url: https://pypi.org/p/fibmeowicci
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      # Don't upload or download artifacts, since we've just built them.
      # And publish to pypi. Since this depends on the prior job
      # (which depends on the `Checks` workflow succeeding) we
      # only publish on success.
      #
      # Note: This needs the Trusted Publisher stuff active and
      # correct on pypi, thus why this whole thing exists, since
      # that's a little funky to get set up.
      # AS I UNDERSTAND: you need to go to the
      # "Publishing" section of your project
      # (e.g. https://pypi.org/manage/project/{PROJECT_NAME}/settings/publishing/)
      # and set the Add a new publisher for:
      # GitHub:
      # Owner: you (or your org)
      # Repository name: the github repo name (e.g. `action_playground`)
      # Workflow name: name of this workflow (`python-package.yml`)
      # Environment: pypi-publish

      - name: validate build
        run: |
          ls -aFl dist/
      - name: Publish release to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
