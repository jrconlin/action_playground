name: Package and Publish

run-name: Package and Publish

on:
  workflow_run:
    workflows:
      - 'Python Checks'
    types:
      - completed
    branches:
      - main

jobs:
  release-build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success'}}
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install Build
          python -m Build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    needs:
      - release-build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/p/fibmeowicci
    steps:
      - name: Pull release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/
      - name: validate build
        run: |
          ls -aFl dist/
      - name: Publish release to pypi
        uses: pypa/gh-actions-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
