# Lint and validation check for package

name: Python Checks

run-name: Checks

on:
  push

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PYTHON_VER
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: |
          isort --sp pyproject.toml -c fibmeowicci
          black --quiet --diff --config pyproject.toml --check fibmeowicci
          bandit --quiet -c pyproject.toml fibmeowicci
      - name: test
        run: |
          pytest fibmeowicci

